controller_manager:
  ros__parameters:
    update_rate: 50

    # https://github.com/ros-controls/ros2_controllers/tree/jazzy/joint_state_broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # https://github.com/ros-controls/ros2_controllers/tree/jazzy/diff_drive_controller
    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

    # https://github.com/ros-controls/ros2_controllers/tree/jazzy/forward_command_controller
    arm_joints_controller:
      type: forward_command_controller/ForwardCommandController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["base_left_wheel_joint"]
    right_wheel_names: ["base_right_wheel_joint"]

    wheel_separation: 0.45
    wheel_radius: 0.1

    odom_frame_id: "odom"
    base_frame_id: "base_footprint"

    enable_odom_tf: true
    publish_rate: 50.0

    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

arm_joints_controller:
  ros__parameters:
    joint_names: ["arm_joint1", "arm_joint2"]
    interface_name: "position"
